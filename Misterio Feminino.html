  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

242,232,220,0.80); margin:0 0 clamp(22px,3vw,28px); max-width:56ch;\">Foi presa cedo, quando te ensinaram que querer era perigo. E ninguém te contou que dá pra buscar de volta.<\u002Fp>\n\n          <p data-hero-el=\"4\" style=\"font-size:clamp(15px,3.7vw,17px); line-height:1.6; color:rgba(242,232,220,0.62); margin:0 0 clamp(26px,4vw,34px); padding-left:16px; border-left:2px solid rgba(181,80,46,0.75); max-width:52ch;\">Aula ao vivo com prática coletiva no meio. Você não sai com informação. Sai sentindo no corpo.<\u002Fp>\n\n          <div data-hero-el=\"5\" style=\"background:rgba(36,22,20,0.9); border:1px solid rgba(168,137,79,0.35); border-radius:4px; padding:clamp(16px,3.4vw,20px) clamp(18px,3.6vw,24px); margin-bottom:clamp(24px,4vw,30px); max-width:460px;\">\n            <div style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(17px,4.2vw,20px); line-height:1.35; color:#F7EFE4; margin-bottom:8px;\">Quarta, 29 de julho, às 12h de Brasília<\u002Fdiv>\n            <div style=\"font-size:clamp(14px,3.5vw,15px); line-height:1.5; color:rgba(242,232,220,0.60);\">Sala fechada. Vaga limitada porque a prática precisa de campo fechado.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <button data-hero-el=\"6\" sc-camel-on-click=\"{{ openForm }}\" style=\"display:block; width:100%; max-width:460px; padding:clamp(18px,4vw,21px) 28px; border:0; border-radius:4px; background:#B5502E; color:#FBF3E9; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:clamp(14px,3.6vw,16px); letter-spacing:0.10em; cursor:pointer; text-align:center;\" style-hover=\"background:#C25C36;\" type=\"button\">QUERO MEU LUGAR NA SALA<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 2 · CARD FLUTUANTE + LINHA DO TEMPO ============ -->\n  <section data-screen-label=\"Card flutuante\" style=\"position:relative; background:#17100E;\">\n    <div style=\"max-width:900px; margin:0 auto; padding:0 22px;\">\n      <div data-rv=\"1\" style=\"margin-top:clamp(-64px,-6vw,-46px); background:#F4EADC; border-radius:5px; padding:clamp(28px,5.4vw,44px) clamp(24px,5vw,48px); box-shadow:0 24px 60px rgba(0,0,0,0.5);\">\n        <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(20px,5vw,29px); line-height:1.34; color:#2A1A16; margin:0; text-wrap:pretty;\">Você não perdeu a vontade.<br>Te ensinaram a desligar.<br><span style=\"color:#8A5A2B;\">E ninguém nunca te ensinou a ligar de volta.<\u002Fspan><\u002Fp>\n\n        <div style=\"margin-top:clamp(30px,5vw,40px); padding-top:clamp(26px,4.4vw,32px); border-top:1px solid rgba(138,90,43,0.28);\">\n          <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.22em; color:rgba(138,90,43,0.75); margin-bottom:clamp(20px,3.4vw,26px);\">ONDE ELA FICOU PRESA<\u002Fdiv>\n          <div data-timeline=\"1\" style=\"display:flex; flex-direction:column; gap:0;\">\n            <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:flex-start; gap:16px;\">\n                <div style=\"display:flex; flex-direction:column; align-items:center; flex-shrink:0; align-self:stretch;\">\n                  <span style=\"width:11px; height:11px; border-radius:50%; border:1.5px solid #A8894F; background:#F4EADC; margin-top:4px; flex-shrink:0;\"><\u002Fspan>\n                  <sc-if value=\"{{ t.line }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"width:1px; flex:1; min-height:26px; background:rgba(168,137,79,0.6);\"><\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"padding-bottom:22px;\">\n                  <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.20em; color:#8A5A2B; margin-bottom:4px;\">{{ t.label }}<\u002Fdiv>\n                  <div style=\"font-size:clamp(15px,3.7vw,17px); line-height:1.5; color:rgba(42,26,22,0.78);\">{{ t.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 3 · DIAGNÓSTICO ============ -->\n  <section data-screen-label=\"Diagnóstico\" style=\"position:relative; background:#17100E;\">\n    <div style=\"max-width:680px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(24px,4vw,32px);\">O DIAGNÓSTICO<\u002Fdiv>\n      <div data-rv-stagger=\"1\" style=\"display:flex; flex-direction:column; gap:clamp(20px,3.4vw,26px);\">\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Primeiro sumiu a vontade de ser tocada. Você achou que era fase.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Depois sumiu a vontade de sair, de criar, de começar coisa nova. Você chamou de excesso de trabalho.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Aí sumiu a vontade de você mesma. E aí já não tinha nome nenhum.<\u002Fp>\n        <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:clamp(19px,4.6vw,24px); line-height:1.5; color:#F7EFE4; margin:clamp(8px,1.4vw,12px) 0; padding-left:18px; border-left:2px solid #A8894F;\">É tudo a mesma força. A que move o corpo é a que move a vida. Quando ela fica presa em um lugar, falta em todos.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">E ela ficou presa cedo. Na igreja que chamou desejo de pecado. Na casa onde riram do teu caminho. No pai que não olhou. No que aconteceu com você e ninguém nomeou.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Você aprendeu que querer era perigo. Então parou de querer. E chamou isso de <span style=\"color:#C9A45C; font-style:italic;\">maturidade.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 4 · O QUE VOCÊ FEZ NO LUGAR ============ -->\n  <section data-screen-label=\"Provedora\" style=\"position:relative; background:#1C1210; border-top:1px solid rgba(168,137,79,0.14); border-bottom:1px solid rgba(168,137,79,0.14);\">\n    <div style=\"max-width:680px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(18px,3vw,22px);\">O QUE VOCÊ FEZ NO LUGAR<\u002Fdiv>\n      <h2 data-rv=\"1\" style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(24px,5.8vw,36px); line-height:1.24; color:#F7EFE4; margin:0 0 clamp(24px,4vw,32px); text-wrap:pretty;\">Você virou o próprio provedor.<\u002Fh2>\n      <div data-rv-stagger=\"1\" style=\"display:flex; flex-direction:column; gap:clamp(20px,3.4vw,26px);\">\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Trabalhou igual homem porque foi o único jeito de se sentir segura que te ensinaram. Deu conta de tudo. Sustentou. Resolveu a vida de quem chegou.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">E funcionou por um tempo.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Só que o preço veio no corpo. A pele que não pede mais nada. A boca que não tem vontade. O sono que não descansa.<\u002Fp>\n        <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:clamp(19px,4.6vw,24px); line-height:1.5; color:#F7EFE4; margin:clamp(8px,1.4vw,12px) 0 0; padding-left:18px; border-left:2px solid rgba(181,80,46,0.85);\">Você já entendeu sozinha que trabalhar igual homem é furado. O que ninguém te disse é o que fazer com a energia que sobrou dessa conta.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 5 · COMPARATIVO ============ -->\n  <section data-screen-label=\"Comparativo\" style=\"position:relative; background:#17100E;\">\n    <div style=\"max-width:1000px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(26px,4.4vw,36px);\">O NOME CERTO DA COISA<\u002Fdiv>\n      <div data-compare=\"1\" data-rv-stagger=\"1\" style=\"display:grid; grid-template-columns:1fr; gap:clamp(18px,3vw,24px);\">\n        <div style=\"background:rgba(36,22,20,0.6); border:1px solid rgba(242,232,220,0.12); border-radius:4px; padding:clamp(26px,4.6vw,36px);\">\n          <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.20em; color:rgba(242,232,220,0.5); margin-bottom:clamp(20px,3.4vw,26px);\">O QUE TE DISSERAM QUE ERA<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ told }}\" as=\"i\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; align-items:flex-start; gap:12px;\">\n                <span style=\"flex-shrink:0; width:16px; height:16px; margin-top:5px; color:rgba(242,232,220,0.35); font-size:13px; line-height:1;\">✕<\u002Fspan>\n                <span style=\"font-size:clamp(16px,4vw,18px); line-height:1.5; color:rgba(242,232,220,0.6);\">{{ i.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(52,28,20,0.55); border:1px solid rgba(168,137,79,0.4); border-radius:4px; padding:clamp(26px,4.6vw,36px);\">\n          <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.20em; color:#C9A45C; margin-bottom:clamp(20px,3.4vw,26px);\">O QUE É<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <sc-for list=\"{{ truth }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:flex-start; gap:12px;\">\n                <span style=\"flex-shrink:0; width:16px; height:16px; margin-top:4px; color:#B5502E; font-size:14px; line-height:1;\">◆<\u002Fspan>\n                <span style=\"font-size:clamp(16px,4vw,18px); line-height:1.55; color:#F2E8DC;\">{{ i.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 6 · O QUE ACONTECE NA AULA ============ -->\n  <section data-screen-label=\"Na aula\" style=\"position:relative; background:#1C1210; border-top:1px solid rgba(168,137,79,0.14);\">\n    <div style=\"max-width:1060px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(18px,3vw,22px);\">O QUE ACONTECE NA AULA<\u002Fdiv>\n      <h2 data-rv=\"1\" style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(24px,5.8vw,36px); line-height:1.26; color:#F7EFE4; margin:0 0 clamp(30px,5vw,44px); max-width:24ch; text-wrap:pretty;\">No dia 29 de julho eu vou fazer ao vivo:<\u002Fh2>\n\n      <div data-cards=\"1\" data-rv-stagger=\"1\" style=\"display:grid; grid-template-columns:1fr; gap:clamp(16px,2.6vw,20px); margin-bottom:clamp(30px,5vw,44px);\">\n        <sc-for list=\"{{ agenda }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; gap:18px; background:rgba(36,22,20,0.55); border:1px solid rgba(168,137,79,0.22); border-radius:4px; padding:clamp(22px,4vw,28px);\">\n            <span style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(20px,4.4vw,26px); line-height:1; color:rgba(168,137,79,0.85); flex-shrink:0;\">{{ a.n }}<\u002Fspan>\n            <p style=\"font-size:clamp(16px,4vw,18px); line-height:1.55; color:#F2E8DC; margin:0;\">{{ a.t }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div data-objections=\"1\" data-rv-stagger=\"1\" style=\"display:grid; grid-template-columns:1fr; gap:clamp(12px,2vw,16px);\">\n        <sc-for list=\"{{ objections }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:flex-start; gap:12px; padding:clamp(16px,3vw,20px) clamp(18px,3.2vw,22px); border:1px solid rgba(242,232,220,0.12); border-radius:4px;\">\n            <span style=\"flex-shrink:0; color:#B5502E; font-size:13px; line-height:1; margin-top:4px;\">◆<\u002Fspan>\n            <span style=\"font-size:clamp(15px,3.8vw,17px); line-height:1.5; color:rgba(242,232,220,0.75);\">{{ o.t }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 7 · O PONTO B ============ -->\n  <section data-screen-label=\"Ponto B\" style=\"position:relative; background:radial-gradient(800px 620px at 50% 30%, rgba(120,44,28,0.24), transparent 64%), #17100E; border-top:1px solid rgba(168,137,79,0.14);\">\n    <div style=\"max-width:680px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(24px,4vw,32px);\">DAQUI ALGUMAS SEMANAS<\u002Fdiv>\n      <div data-rv-stagger=\"1\" style=\"display:flex; flex-direction:column; gap:clamp(20px,3.4vw,26px);\">\n        <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:clamp(20px,4.9vw,26px); line-height:1.48; color:#F7EFE4; margin:0;\">Imagina uma terça comum daqui algumas semanas.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Você acorda antes do despertador e não tem aquele peso no peito. Toma café sem resolver a vida de ninguém.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Alguém te toca e o corpo responde antes de você pensar.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">Você olha no espelho e não procura defeito. Só se olha.<\u002Fp>\n        <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.66; color:rgba(242,232,220,0.82); margin:0;\">E quando alguém te quer, você não se apaga pra caber. Fica inteira e deixa querer.<\u002Fp>\n        <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:clamp(19px,4.6vw,24px); line-height:1.5; color:#C9A45C; margin:clamp(8px,1.4vw,12px) 0 0; padding-left:18px; border-left:2px solid #A8894F;\">Não é outra vida. É a sua, com a energia que já era sua de volta.<\u002Fp>\n      <\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ openForm }}\" style=\"display:block; width:100%; max-width:460px; margin:clamp(34px,5.4vw,46px) auto 0; padding:clamp(18px,4vw,21px) 28px; border:0; border-radius:4px; background:#B5502E; color:#FBF3E9; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:clamp(14px,3.6vw,16px); letter-spacing:0.10em; cursor:pointer;\" style-hover=\"background:#C25C36;\">QUERO MEU LUGAR NA SALA<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 8 · PROVA ============ -->\n  <section data-screen-label=\"Prova\" style=\"position:relative; background:#1C1210; border-top:1px solid rgba(168,137,79,0.14);\">\n    <div style=\"max-width:1000px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(18px,3vw,22px);\">DEPOIS DA ÚLTIMA PRÁTICA<\u002Fdiv>\n      <h2 data-rv=\"1\" style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(21px,5vw,30px); line-height:1.3; color:#F7EFE4; margin:0 0 clamp(28px,4.6vw,40px); max-width:30ch; text-wrap:pretty;\">O que elas escreveram depois da última prática coletiva:<\u002Fh2>\n\n      <div data-rv=\"1\" style=\"max-width:520px; background:#191310; border-radius:8px; padding:clamp(16px,3.4vw,22px);\">\n        <div data-proof=\"1\" data-rv-stagger=\"1\" style=\"display:flex; flex-direction:column; gap:14px;\">\n          <sc-for list=\"{{ proof }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex; align-items:flex-end; gap:9px;\">\n              <span style=\"width:28px; height:28px; border-radius:50%; background:rgba(168,137,79,0.35); flex-shrink:0; filter:{{ avatarBlur }};\"><\u002Fspan>\n              <div style=\"background:#243B2E; border-radius:10px 10px 10px 2px; padding:9px 12px 7px; max-width:82%;\">\n                <span style=\"display:block; height:8px; width:74px; border-radius:3px; background:rgba(201,164,92,0.55); margin-bottom:6px; filter:{{ nameBlur }};\"><\u002Fspan>\n                <span style=\"font-size:clamp(15px,3.8vw,16.5px); line-height:1.45; color:#EAF2E8;\">{{ p.t }}<\u002Fspan>\n                <span style=\"display:block; text-align:right; font-size:10px; color:rgba(234,242,232,0.45); margin-top:3px;\">{{ p.time }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px; line-height:1.5; color:rgba(242,232,220,0.58); margin:clamp(20px,3.4vw,26px) 0 0;\">Mensagens reais do grupo da imersão. Nome e foto preservados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 9 · QUEM CONDUZ ============ -->\n  <section data-screen-label=\"Quem conduz\" style=\"position:relative; background:#17100E; border-top:1px solid rgba(168,137,79,0.14);\">\n    <div data-mentor=\"1\" data-rv=\"1\" style=\"max-width:1060px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px; display:grid; grid-template-columns:1fr; gap:clamp(30px,4.6vw,52px); align-items:start;\">\n      <div data-mentor-photo=\"1\" style=\"max-width:340px; width:100%; justify-self:center;\">\n        <div style=\"overflow:hidden; border-radius:4px; border:1px solid rgba(168,137,79,0.28);\">\n          <img src=\"774a071a-89b8-4acc-a4a2-732d4367fc16\" alt=\"Hamad Sedulus\" style=\"display:block; width:100%;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:14px;\">QUEM VAI ESTAR COM VOCÊ<\u002Fdiv>\n        <h2 style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(24px,5.6vw,34px); line-height:1.2; color:#F7EFE4; margin:0 0 clamp(22px,3.6vw,28px);\">Hamad Sedulus<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:clamp(18px,3vw,22px); max-width:56ch;\">\n          <p style=\"font-size:clamp(16px,4vw,19px); line-height:1.64; color:rgba(242,232,220,0.80); margin:0;\">Eu larguei a escola no fundamental. Fui peão de obra por dez anos. Me chamaram de burro e de louco, nessa ordem.<\u002Fp>\n          <p style=\"font-size:clamp(16px,4vw,19px); line-height:1.64; color:rgba(242,232,220,0.80); margin:0;\">Rompi com a religião aos treze e passei anos sem saber o que fazer com o que eu sentia no corpo. Ninguém me explicou. Ninguém explica pra ninguém.<\u002Fp>\n          <p style=\"font-size:clamp(16px,4vw,19px); line-height:1.64; color:rgba(242,232,220,0.80); margin:0;\">Hoje eu conduzo a Escola de Energias de Quinta Dimensão e trabalho com mulher que já andou muito. Terapeuta, psicanalista, xamã, médium.<\u002Fp>\n          <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:clamp(18px,4.4vw,22px); line-height:1.5; color:#C9A45C; margin:0; padding-left:18px; border-left:2px solid #A8894F;\">Eu não vou te dar um método pra você depender de mim. Eu vou te devolver o acesso ao que já é seu.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 10 · PRA QUEM É ============ -->\n  <section data-screen-label=\"Pra quem é\" style=\"position:relative; background:#1C1210; border-top:1px solid rgba(168,137,79,0.14);\">\n    <div style=\"max-width:860px; margin:0 auto; padding:clamp(66px,10vw,110px) 22px;\">\n      <div data-rv=\"1\" style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; color:#A8894F; margin-bottom:clamp(26px,4.4vw,36px);\">PRA QUEM É<\u002Fdiv>\n      <div data-rv-stagger=\"1\" style=\"display:flex; flex-direction:column; gap:clamp(18px,3vw,24px);\">\n        <sc-for list=\"{{ forWhom }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:flex-start; gap:16px; padding-bottom:clamp(18px,3vw,24px); border-bottom:1px solid rgba(168,137,79,0.16);\">\n            <span style=\"flex-shrink:0; color:#B5502E; font-size:14px; line-height:1; margin-top:6px;\">◆<\u002Fspan>\n            <p style=\"font-size:clamp(16px,4vw,19px); line-height:1.6; color:rgba(242,232,220,0.82); margin:0;\">{{ w.t }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BLOCO 11 · FECHO ============ -->\n  <section data-screen-label=\"Fecho\" style=\"position:relative; background:radial-gradient(700px 560px at 50% 40%, rgba(120,44,28,0.26), transparent 66%), #17100E; border-top:1px solid rgba(168,137,79,0.2);\">\n    <div data-rv=\"1\" style=\"max-width:640px; margin:0 auto; padding:clamp(70px,10vw,120px) 22px clamp(58px,8vw,96px); text-align:center;\">\n      <p style=\"font-size:clamp(17px,4.2vw,20px); line-height:1.64; color:rgba(242,232,220,0.80); margin:0 0 clamp(18px,3vw,24px);\">A sala tem limite e eu não abro mais que isso, porque a prática precisa de campo fechado.<\u002Fp>\n      <p style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(22px,5.4vw,32px); line-height:1.32; color:#F7EFE4; margin:0 0 clamp(30px,5vw,40px); text-wrap:pretty;\">Você não precisa decidir a vida inteira hoje. <span style=\"color:#C9A45C;\">Decide só entrar na sala.<\u002Fspan><\u002Fp>\n\n      <button sc-camel-on-click=\"{{ openForm }}\" style=\"display:block; width:100%; max-width:460px; margin:0 auto; padding:clamp(18px,4vw,21px) 28px; border:0; border-radius:4px; background:#B5502E; color:#FBF3E9; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:clamp(14px,3.6vw,16px); letter-spacing:0.10em; cursor:pointer;\" style-hover=\"background:#C25C36;\">QUERO MEU LUGAR NA SALA<\u002Fbutton>\n      <p style=\"font-size:clamp(13px,3.4vw,15px); line-height:1.5; color:rgba(242,232,220,0.55); margin:16px 0 0;\">O link da sala eu mando no grupo uma hora antes.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid rgba(168,137,79,0.16);\">\n      <div style=\"max-width:1060px; margin:0 auto; padding:26px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;\">\n        <span style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.22em; color:rgba(242,232,220,0.45);\">MISTÉRIO FEMININO<\u002Fspan>\n        <span style=\"font-family:'Libre Baskerville',Georgia,serif; font-style:italic; font-size:14px; color:rgba(242,232,220,0.40);\">Instituto Mundos Entrelaçados<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CTA FIXO MOBILE ============ -->\n  <sc-if value=\"{{ showStickyCta }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-sticky-cta=\"1\" style=\"position:fixed; left:0; right:0; bottom:0; z-index:80; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(19,13,11,0.94); border-top:1px solid rgba(168,137,79,0.3); backdrop-filter:blur(8px); animation:mfIn 0.3s ease-out;\">\n      <div style=\"display:flex; align-items:center; gap:12px; max-width:520px; margin:0 auto;\">\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:0.16em; color:#C9A45C;\">QUARTA, 29/07 · 12H<\u002Fdiv>\n          <div style=\"font-family:'Libre Baskerville',Georgia,serif; font-size:13px; line-height:1.25; color:rgba(242,232,220,0.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">Sala fechada, vaga limitada<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openForm }}\" type=\"button\" style=\"flex-shrink:0; padding:14px 20px; border:0; border-radius:4px; background:#B5502E; color:#FBF3E9; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:0.08em; cursor:pointer;\" style-hover=\"background:#C25C36;\">QUERO MEU LUGAR<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ POPUP DE CAPTURA ============ -->\n  <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ backdropClick }}\" style=\"position:fixed; inset:0; z-index:100; background:rgba(12,8,7,0.86); display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto;\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"position:relative; width:100%; max-width:440px; margin:auto; background:#1E1512; border:1px solid rgba(168,137,79,0.4); border-radius:6px; padding:clamp(26px,5vw,36px); animation:mfIn 0.28s ease-out;\">\n        <button sc-camel-on-click=\"{{ closeForm }}\" aria-label=\"Fechar\" style=\"position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(242,232,220,0.22); background:transparent; color:rgba(242,232,220,0.65); font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;\">✕<\u002Fbutton>\n\n        <div style=\"font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.24em; color:#A8894F; margin-bottom:12px;\">QUARTA, 29/07 · 12H DE BRASÍLIA<\u002Fdiv>\n        <h3 style=\"font-family:'Libre Baskerville',Georgia,serif; font-weight:700; font-size:clamp(20px,5vw,25px); line-height:1.3; color:#F7EFE4; margin:0 0 8px;\">Seu lugar na sala<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.5; color:rgba(242,232,220,0.62); margin:0 0 24px;\">Preenche e você entra no grupo, onde eu mando o link uma hora antes.<\u002Fp>\n\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <label style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:12px; font-weight:600; letter-spacing:0.06em; color:rgba(242,232,220,0.65);\">SEU NOME<\u002Fspan>\n            <input value=\"{{ fName }}\" sc-camel-on-input=\"{{ setName }}\" type=\"text\" placeholder=\"Como você quer ser chamada\" style=\"width:100%; padding:13px 14px; border-radius:4px; border:1px solid rgba(168,137,79,0.35); background:#17100E; color:#F2E8DC; font-family:'Source Sans 3',sans-serif; font-size:16px;\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:12px; font-weight:600; letter-spacing:0.06em; color:rgba(242,232,220,0.65);\">E-MAIL<\u002Fspan>\n            <input value=\"{{ fEmail }}\" sc-camel-on-input=\"{{ setEmail }}\" type=\"email\" placeholder=\"seu@email.com\" style=\"width:100%; padding:13px 14px; border-radius:4px; border:1px solid rgba(168,137,79,0.35); background:#17100E; color:#F2E8DC; font-family:'Source Sans 3',sans-serif; font-size:16px;\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:12px; font-weight:600; letter-spacing:0.06em; color:rgba(242,232,220,0.65);\">WHATSAPP<\u002Fspan>\n            <input value=\"{{ fPhone }}\" sc-camel-on-input=\"{{ setPhone }}\" type=\"tel\" placeholder=\"(00) 00000-0000\" style=\"width:100%; padding:13px 14px; border-radius:4px; border:1px solid rgba(168,137,79,0.35); background:#17100E; color:#F2E8DC; font-family:'Source Sans 3',sans-serif; font-size:16px;\">\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:13.5px; line-height:1.4; color:#E08464; margin:12px 0 0;\">{{ formErrorText }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <button sc-camel-on-click=\"{{ submitForm }}\" style=\"display:block; width:100%; margin-top:20px; padding:17px 24px; border:0; border-radius:4px; background:#B5502E; color:#FBF3E9; font-family:'Source Sans 3',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.08em; cursor:pointer;\" style-hover=\"background:#C25C36;\">{{ submitLabel }}<\u002Fbutton>\n        <p style=\"font-size:12px; line-height:1.45; color:rgba(242,232,220,0.42); margin:12px 0 0; text-align:center;\">Seus dados ficam comigo. Nada de spam.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;groupUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://meugrupo.vip/c/4385c03c-f35e-4a02-a13b-ea2130f18728&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Captura&quot;},&quot;blurProofNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prova&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    formOpen: false, name: '', email: '', phone: '',\n    error: '', sending: false, pastHero: false\n  };\n\n  get groupUrl() {\n    return this.props.groupUrl ?? 'https://meugrupo.vip/c/4385c03c-f35e-4a02-a13b-ea2130f18728';\n  }\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if (e.key === 'Escape' && this.state.formOpen) this.setState({ formOpen: false });\n    };\n    window.addEventListener('keydown', this._onKey);\n\n    this._onScroll = () => {\n      const hero = document.querySelector('[data-screen-label=\"Hero\"]');\n      const past = hero ? window.scrollY > hero.offsetTop + hero.offsetHeight - 80 : window.scrollY > 500;\n      if (past !== this.state.pastHero) this.setState({ pastHero: past });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    const targets = document.querySelectorAll('[data-rv], [data-rv-stagger]');\n    if ('IntersectionObserver' in window) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.classList.add('mf-in'); this._io.unobserve(en.target); }\n        });\n      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });\n      targets.forEach((el) => this._io.observe(el));\n      // safety: never leave content hidden (embeds, stalled rAF)\n      this._rvSafety = setTimeout(() => targets.forEach((el) => el.classList.add('mf-in')), 6000);\n    } else {\n      targets.forEach((el) => el.classList.add('mf-in'));\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._onKey) window.removeEventListener('keydown', this._onKey);\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n    if (this._rvSafety) clearTimeout(this._rvSafety);\n  }\n\n  submit = () => {\n    const { name, email, phone } = this.state;\n    if (!name.trim()) return this.setState({ error: 'Escreve seu nome pra eu saber quem chegou.' });\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email.trim())) return this.setState({ error: 'Confere o e-mail, parece incompleto.' });\n    if (phone.replace(/\\D/g, '').length < 10) return this.setState({ error: 'Confere o WhatsApp com DDD.' });\n    this.setState({ error: '', sending: true });\n    try {\n      const key = 'mf_leads';\n      const list = JSON.parse(localStorage.getItem(key) || '[]');\n      list.push({ name, email, phone, at: new Date().toISOString() });\n      localStorage.setItem(key, JSON.stringify(list));\n    } catch (e) { /* storage unavailable — still redirect */ }\n    setTimeout(() => { window.location.href = this.groupUrl; }, 500);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const blur = this.props.blurProofNames ?? true;\n    return {\n      avatarBlur: blur ? 'blur(3px)' : 'none',\n      nameBlur: blur ? 'blur(2.5px)' : 'none',\n      formOpen: s.formOpen,\n      showStickyCta: s.pastHero && !s.formOpen,\n      openForm: () => this.setState({ formOpen: true, error: '' }),\n      closeForm: () => this.setState({ formOpen: false }),\n      backdropClick: () => this.setState({ formOpen: false }),\n      stopClick: (e) => e.stopPropagation(),\n      fName: s.name, fEmail: s.email, fPhone: s.phone,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setEmail: (e) => this.setState({ email: e.target.value }),\n      setPhone: (e) => this.setState({ phone: e.target.value }),\n      submitForm: this.submit,\n      submitLabel: s.sending ? 'ENTRANDO NO GRUPO…' : 'ENTRAR NO GRUPO',\n      formError: !!s.error,\n      formErrorText: s.error,\n\n      timeline: [\n        { label: 'IGREJA', text: 'Chamou desejo de pecado.', line: true },\n        { label: 'CASA', text: 'Riram do teu caminho.', line: true },\n        { label: 'PAI', text: 'Não olhou.', line: true },\n        { label: 'O QUE ACONTECEU', text: 'E ninguém nomeou.', line: false }\n      ],\n      told: [\n        { t: 'Cansaço.' }, { t: 'Idade.' }, { t: 'Fase.' },\n        { t: 'Estresse.' }, { t: 'Falta de tempo.' },\n        { t: 'Coisa de quem trabalha demais.' }\n      ],\n      truth: [\n        { t: 'Desejo que foi policiado antes de ser vivido.' },\n        { t: 'Energia sexual retida, que é a primeira a ser retida em toda mulher.' },\n        { t: 'Prazer preso em memória que não é sua, é da tua linhagem.' },\n        { t: 'Fractal preso. Tem nome, tem lugar e tem volta.' }\n      ],\n      agenda: [\n        { n: '01', t: 'Onde essa energia ficou presa em você. Não em geral, em você.' },\n        { n: '02', t: 'Por que é sempre o desejo que trava primeiro, e por que ninguém te avisou.' },\n        { n: '03', t: 'O que volta junto quando ele volta. O corpo, a vontade de criar e a coragem de ser desejada.' },\n        { n: '04', t: 'Prática coletiva ao vivo, comigo, no meio da aula. É onde a coisa acontece de verdade.' }\n      ],\n      objections: [\n        { t: 'Sem precisar acreditar em nada antes.' },\n        { t: 'Sem precisar contar pra ninguém em casa.' },\n        { t: 'Sem aula de iniciante. Eu não vou te ensinar o que você já domina.' }\n      ],\n      proof: [\n        { t: 'estou me amando bruxa', time: '21:14' },\n        { t: 'me senti mais bonita depois da imersão', time: '21:22' },\n        { t: 'me trouxe calmaria, paz e alento', time: '21:36' },\n        { t: 'minha família de sangue nunca me aceitou, minha família são vocês', time: '22:03' },\n        { t: 'sensação muito gostosa de pertencimento', time: '22:11' }\n      ],\n      forWhom: [\n        { t: 'Pra quem já andou muito. Terapeuta, psicanalista, xamã, médium, radiestesista, ou quem trabalha com energia sem colocar nome nisso.' },\n        { t: 'Pra quem já fez curso, já leu, já sabe. E mesmo assim repete o mesmo padrão com outra roupa.' },\n        { t: 'Pra quem virou o próprio provedor e perdeu o desejo no caminho.' },\n        { t: 'Pra quem já sentiu, mesmo que uma vez só, que tem uma mulher inteira presa aí dentro esperando permissão.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
